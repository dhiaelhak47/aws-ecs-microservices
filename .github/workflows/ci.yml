name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, orders-service, notifications-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app/${{ matrix.service }}

      - name: Run tests
        run: npm test
        working-directory: app/${{ matrix.service }}
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, orders-service, notifications-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:test ./app/${{ matrix.service }}
